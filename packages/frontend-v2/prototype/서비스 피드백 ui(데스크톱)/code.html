<!-- Interactive Logic for State Management -->
<script>
    // Character counter logic
    function handleTextareaCount(textarea) {
      const length = textarea.value.length;
      document.getElementById('charCount').textContent = length;
    }

    // Topic Chip selection logic
    function selectTopic(clickedBtn) {
      const chips = document.querySelectorAll('.topic-chip');
      chips.forEach(chip => {
        chip.setAttribute('aria-checked', 'false');
        chip.className = 'topic-chip px-3.5 py-2 rounded-lg border text-label-md font-label-md transition-all duration-150 border-outline-variant bg-surface-container-lowest text-on-surface hover:border-secondary hover:text-secondary';
      });

      clickedBtn.setAttribute('aria-checked', 'true');
      clickedBtn.className = 'topic-chip px-3.5 py-2 rounded-lg border text-label-md font-label-md transition-all duration-150 border-secondary bg-secondary/5 text-secondary font-semibold';
    }

    // Rating selection logic
    function selectRating(clickedBtn, label) {
      const buttons = document.querySelectorAll('.rating-btn');
      document.getElementById('ratingDescriptor').textContent = label;

      buttons.forEach(btn => {
        btn.setAttribute('aria-checked', 'false');
        btn.className = 'rating-btn group flex flex-col items-center justify-center py-3 px-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:border-secondary hover:text-secondary transition-all';
        const icon = btn.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.className = 'material-symbols-outlined text-[26px] mb-1 text-on-surface-variant group-hover:text-secondary transition-transform group-hover:scale-110';
          icon.style.fontVariationSettings = "'FILL' 0";
        }
      });

      clickedBtn.setAttribute('aria-checked', 'true');
      clickedBtn.className = 'rating-btn group flex flex-col items-center justify-center py-3 px-2 rounded-lg border border-secondary bg-secondary/5 text-secondary transition-all';
      const activeIcon = clickedBtn.querySelector('.material-symbols-outlined');
      if (activeIcon) {
        activeIcon.className = 'material-symbols-outlined text-[26px] mb-1 text-secondary transition-transform group-hover:scale-110';
        activeIcon.style.fontVariationSettings = "'FILL' 1";
      }
    }

    // Form submission feedback
    function submitFeedback() {
      const textarea = document.getElementById('feedbackTextarea');
      if (!textarea.value.trim()) {
        textarea.focus();
        return;
      }
      
      const submitBtn = document.querySelector('button[type="submit"]');
      const originalHTML = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="material-symbols-outlined text-[18px] animate-spin" data-icon="sync">sync</span> <span>전송 중...</span>`;

      setTimeout(() => {
        alert('소중한 의견이 등록되었습니다. OPUS 서비스 발전에 큰 힘이 됩니다.');
        textarea.value = '';
        document.getElementById('charCount').textContent = '0';
        document.getElementById('contactEmail').value = '';
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalHTML;
      }, 700);
    }

    function resetOrClose() {
      if (confirm('작성 중인 피드백 내용을 취소하시겠습니까?')) {
        document.getElementById('feedbackForm').reset();
        document.getElementById('charCount').textContent = '0';
      }
    }
  </script>


</body></html>
