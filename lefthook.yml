# lefthook.yml
pre-commit:
  parallel: true
  commands:
    backend-unit:
      # DB가 필요 없는 유닛 테스트만 실행 (통합 테스트는 PR CI의 db 잡이 담당)
      # fake timers 적용으로 전체 수트가 1초대라 커밋마다 돌려도 부담 없음
      glob: "{packages/backend/**/*,packages/shared/**/*}"
      run: npm test --prefix packages/backend -- run --exclude '**/*.integration.test.ts'

pre-push:
  parallel: true
  commands:
    backend-typecheck:
      # 백엔드 코드나 shared가 바뀌었을 때 타입 체크 (tsc --noEmit)
      glob: "{packages/backend/**/*,packages/shared/**/*}"
      run: npx turbo run build --filter=backend

    frontend-check:
      # 프론트엔드 코드나 shared가 바뀌었을 때 실행
      glob: "{packages/frontend/**/*,packages/shared/**/*}"
      run: npx turbo run build --filter=frontend

    syncpack:
      # 의존성 버전 불일치 검사 (package.json이 바뀐 push에서만)
      glob: "packages/*/package.json"
      run: npx syncpack lint
