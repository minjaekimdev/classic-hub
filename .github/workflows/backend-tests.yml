name: Backend Tests

on:
  pull_request:

  workflow_dispatch:

# 같은 브랜치에 새 커밋이 push되면 진행 중인 실행을 취소 (낭비 제거)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # client.ts/kopis client가 import 시점에 env를 요구하므로 주입이 필요하다.
      # 유닛 테스트는 실제 접속을 하지 않으므로 로컬 스택 값과 더미 키로 import만 통과시킨다.
      # (cron 워크플로우와 동일한 env 주입 방식이되, 테스트는 프로덕션 secrets을 향하지 않게 한다)
      - name: Run unit tests
        working-directory: packages/backend
        env:
          NODE_ENV: test
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          KOPIS_SERVICE_KEY: dummy-kopis-service-key
        run: npx vitest run --exclude '**/*.integration.test.ts'

  # PR 머지 전에 로컬 Supabase 환경에서의 전체 파이프라인을 반드시 검증한다.
  # 연속 push에는 concurrency로 마지막 실행만 남는다.
  db:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start && npx supabase db reset

      # 통합 테스트는 CI 내부의 로컬 Supabase(127.0.0.1:54321)를 향해야 하므로
      # secrets이 아닌 로컬 스택 값을 주입한다 (Edge Function 스텝과 동일한 값).
      # KOPIS는 msw 픽스처로 가로채므로 더미 키로 충분하다.
      - name: Run integration tests
        working-directory: packages/backend
        env:
          NODE_ENV: test
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          KOPIS_SERVICE_KEY: dummy-kopis-service-key
        # 'integration' 필터는 syncPerformances.integration과 rankingView.integration을 모두 실행한다.
        run: npx vitest run integration

      # ── Edge Function 테스트 (같은 Supabase 스택 재사용) ──
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Edge Function tests
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          # 로컬 스택의 표준 데모 서비스롤 키 (config.toml 기본 JWT 시크릿에서 파생)
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
        run: |
          npx supabase functions serve --no-verify-jwt > /dev/null 2>&1 &
          sleep 5
          deno test --allow-net --allow-env supabase/functions/_tests/deleteStorageFileTest.ts supabase/functions/_tests/taskWorkerTest.ts
