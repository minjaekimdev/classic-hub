# 워크플로우의 이름
name: Ranking Update

# 워크플로우 실행 조건
on:
  schedule:
    # UTC 기준 매일 01:00 (한국 시간 오전 10시)에 실행
    - cron: "0 1 * * *"

  workflow_dispatch:
    # 수동 실행을 위한 버튼 제공

# 실행할 작업 정의
jobs:
  run-daily-job: # job id
    # 작업이 실행될 환경
    runs-on: ubuntu-latest

    # 매달린(hang) 잡을 강제 종료해 "실패"로 기록 → 알림 체계 작동
    timeout-minutes: 30

    # 동시 실행 방지: 이전 실행이 도는 중이면 새 실행이 이전 것을 취소
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    # 작업의 단계(steps) 정의
    steps:
      # 1. 리포지토리 코드를 가상 머신으로 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js 실행 환경 설치
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 3. 필요한 라이브러리 설치 (루트 lockfile 기준, 재현 가능한 설치)
      # workspaces이므로 루트에서 한 번에 설치하면 backend 의존성까지 포함된다.
      - name: Install dependencies
        run: npm ci

      # 4. 데이터 업데이트 스크립트 실행
      - name: Run daily tasks runner script
        run: "npx tsx ./infrastructure/github/updateRanking.ts"
        working-directory: ./packages/backend

        # 환경 변수 주입 방식은 동일합니다.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KOPIS_SERVICE_KEY: ${{ secrets.KOPIS_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}